[package]
name = "dispatch"
version = "0.6.0"
description = "A lightweight API client that syncs with your Postman account"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dispatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip", "brotli", "deflate", "multipart", "json", "cookies"] }
tokio = { version = "1", features = ["fs", "time", "sync", "macros", "rt", "net"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
native-tls = "0.2"
base64 = "0.22"
mime_guess = "2"
libc = "0.2"
cookie = "0.18"
cookie_store = { version = "0.22", default-features = false, features = ["serde_json"] }
tower = { version = "0.5", default-features = false }
# gRPC with messages described at run time (server reflection or .proto files).
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-native-roots", "tls-ring"] }
tonic-reflection = { version = "0.14", default-features = false }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
tokio-stream = "0.1"
tauri-plugin-updater = "2.0.0-rc.4"

# The Postman API key lives in the macOS Keychain.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic-reflection = { version = "0.14", features = ["server"] }
tonic = { version = "0.14", features = ["transport", "server", "router"] }
tokio-stream = { version = "0.1", features = ["net"] }
